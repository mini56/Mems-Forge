name: MEMS Forge — Catalogue candidate regression

on:
  push:
    branches: [main, feature/source-evidence-validation-20261110]
    paths:
      - 'src/mems_forge/catalogue.py'
      - 'src/mems_forge/document_pack.py'
      - 'src/mems_forge/source_validation.py'
      - 'src/mems_forge/adaptive_coverage.py'
      - 'src/mems_forge/depot_pipeline.py'
      - 'src/mems_forge/cli.py'
      - 'src/mems_forge/local_update.py'
      - 'tests/test_combined_search.py'
      - 'tests/test_catalogue.py'
      - 'tests/test_document_pack.py'
      - 'tests/test_source_validation.py'
      - 'tests/test_adaptive_coverage.py'
      - '.github/workflows/catalogue-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Verify candidate catalogue without publishing
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source only
        uses: actions/checkout@v4
        with:
          lfs: false
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install MEMS Forge and pytest
        run: python -m pip install . pytest
      - name: Verify real PDF packs and catalogue safeguards
        run: python -m pytest tests/test_document_pack.py tests/test_catalogue.py tests/test_combined_search.py tests/test_source_validation.py tests/test_adaptive_coverage.py -q
