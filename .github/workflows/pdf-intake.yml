name: MEMS Forge — PDF intake

on:
  push:
    branches:
      - main
    paths:
      - 'depot/*.pdf'
      - 'depot/*.PDF'
      - 'depot/**/*.pdf'
      - 'depot/**/*.PDF'
      - 'src/mems_forge/**'
      - 'tools/depot_intake.py'
      - 'tools/process_depot.py'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/pdf-intake.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  intake:
    name: Read and register deposited PDFs
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository with Git LFS files
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install MEMS Forge reader
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Run reader smoke tests
        run: python -m unittest discover -s tests -v

      - name: Build PDF intake manifest
        run: python tools/depot_intake.py

      - name: Read deposited PDFs
        env:
          MEMS_FORGE_BEFORE_SHA: ${{ github.event.before }}
        run: python tools/process_depot.py

      - name: Upload intake and raw-reader audit
        uses: actions/upload-artifact@v4
        with:
          name: mems-forge-pdf-reader-${{ github.run_id }}
          path: |
            out/intake/
            out/reader/
          if-no-files-found: error
          compression-level: 6
