[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mems-forge"
version = "0.1.0.dev0"
description = "MEMS Forge knowledge-base construction and validation tools"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
mems-forge = "mems_forge.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
